name: banking system backend scheduler server CI & CD

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build & test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./scheduler_server

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scheduler-server-test-report
          path: scheduler_server/build/reports/tests/test
          retention-days: 7

      - name: Upload jar
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: scheduler-server-jar
          path: scheduler_server/build/libs/*.jar
          retention-days: 1

  deploy:
    name: deploy to NCP
    # PR 에서는 배포하지 않는다. develop 에 실제로 머지된 커밋만 배포한다.
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Download jar
        uses: actions/download-artifact@v4
        with:
          name: scheduler-server-jar
          path: deploy

      # jar 와 기동 스크립트를 한 번에 올린다.
      - name: Stage deploy bundle
        run: |
          cp scheduler_server/deploy/run.sh deploy/run.sh
          chmod +x deploy/run.sh

      - name: Copy jar to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.NCP_HOST }}
          username: ${{ secrets.NCP_USERNAME }}
          password: ${{ secrets.NCP_PASS }}
          port: ${{ secrets.NCP_PORT }}
          source: deploy/*
          target: /home/${{ secrets.NCP_USERNAME }}/scheduler_server
          strip_components: 1

      # jar 만 올리고 끝내면 기존 프로세스가 계속 떠 있어 새 버전이 반영되지 않는다.
      - name: Restart application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.NCP_HOST }}
          username: ${{ secrets.NCP_USERNAME }}
          password: ${{ secrets.NCP_PASS }}
          port: ${{ secrets.NCP_PORT }}
          script_stop: true
          script: |
            cd /home/${{ secrets.NCP_USERNAME }}/scheduler_server
            chmod +x run.sh
            ./run.sh restart
